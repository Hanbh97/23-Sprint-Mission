<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/main.css">
  </head>
  <body>
    <header class="header">
      <nav>
        <a class="home-button" href="/">
          <img class="logo" src="/img/Img_logo_sm.png" alt="판다마켓 로고">
        </a>
        <a class="login-button" href="/login.html">로그인</a>
      </nav>
    </header>

    <main>
      <section class="head-section">
        <div class="items-link-contents">
          <h1 class="items-link-script">
            일상의 모든 물건을<br>
            거래해 보세요
          </h1>
          <a class="items-button" href="/items.html">구경하러 가기</a>
        </div>
        <img src="/img/Img_home_top.png" alt="판다마켓 상단 이미지">
      </section>

      <section class="main-section">
        <img src="/img/Img_section_01.png" alt="인기상품 안내 이미지">
        <div class="main-contents right">
          <h1 class="main-contents-header">Hot item</h1>
          <div class="main-script">
            <p class="main-script-lg">
              인기 상품을 <br>
              확인해 보세요
            </p>
            <p class="main-script-sm">
              가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="main-section">
        <div class="main-contents left">
          <h1 class="main-contents-header">Search</h1>
          <div class="main-script">
            <p class="main-script-lg">
              구매를 원하는<br>
              상품을 검색하세요
            </p>
            <p class="main-script-sm">
              구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요
            </p>
          </div>
        </div>
        <img src="/img/Img_section_02.png" alt="상품검색 안내 이미지">
      </section>

      <section class="main-section">
        <img src="/img/Img_section_03.png" alt="상품등록 안내 이미지">
        <div class="main-contents right">
          <h1 class="main-contents-header">Register</h1>
          <div class="main-script">
            <p class="main-script-lg">
              판매를 원하는<br>
              상품을 등록하세요
            </p>
            <p class="main-script-sm">
              어떤 물건이든 판매하고 싶은<br>
              상품을 쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="last-section">
        <div class="last-section-contents">
          <p class="last-section-script">
            믿을 수 있는<br>
            판다마켓 중고 거래
          </p>
          <img src="/img/Img_home_bottom.png" alt="판다마켓 하단 이미지">
        </div>
      </section>
    </main>
    <footer>
      <p class="left-content">©codeit - 2024</p>
      <div class="mid-content">
        <a href="/privacy.html">Privacy Police</a>
        <a href="/faq.html">FAQ</a>
      </div>
      <div class="right-content">
        <a class="social-link" href="https://www.facebook.com/" target="_blank">
          <img src="/img/ic_facebook.svg" alt="페이스북 아이콘">
        </a>
        <a class="social-link" href="https://x.com/" target="_blank">
          <img src="/img/ic_twitter.svg" alt="트위터 아이콘">
        </a>
        <a class="social-link" href="https://www.youtube.com/" target="_blank">
          <img src="/img/ic_youtube.svg" alt="유튜브 아이콘">
        </a>
        <a class="social-link" href="https://www.instagram.com/" target="_blank">
          <img src="/img/ic_instagram.svg" alt="인스타그램 아이콘">
        </a>
      </div>
    </footer>
  </body>
</html>
